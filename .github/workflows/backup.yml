# Nightly off-site database backup.
#
# DigitalOcean already takes daily backups of the cluster, and those are the
# first line of defence. This exists because they live with the database: they
# protect against losing the data, not against losing the account, the region,
# or a mistake that propagates into every managed backup. A second copy on a
# different provider is what makes the redundancy real.
#
# The cluster's firewall admits only the app and a known IP, and GitHub runners
# get an arbitrary address each run — so the job opens a hole for itself, takes
# the dump, and closes it again in an `always()` step. If that cleanup were ever
# skipped the firewall would silently accumulate stale rules, which is why it is
# not conditional on success.
#
# Required repository secrets:
#   DO_API_TOKEN          — DigitalOcean token with read/write on databases
#   BACKUP_DATABASE_URL   — the doadmin connection URI (must read past RLS)
#   DO_DATABASE_CLUSTER_ID
name: Nightly backup

on:
  schedule:
    # 19:30 UTC = 01:00 IST — after every salon has closed.
    - cron: "30 19 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Note the start time
        id: t
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Open the firewall for this runner
        id: fw
        run: |
          RUNNER_IP=$(curl -s --max-time 20 https://api.ipify.org)
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          doctl databases firewalls append "${{ secrets.DO_DATABASE_CLUSTER_ID }}" \
            --rule "ip_addr:$RUNNER_IP"
      - name: Wait until the database is actually reachable
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::BACKUP_DATABASE_URL is not set."
            exit 1
          fi
          # Poll for real connectivity rather than sleeping a guessed number of
          # seconds. A firewall rule takes a variable time to apply across the
          # cluster, and a fixed sleep is either wasteful or — as it was here —
          # occasionally too short. The resulting failure then looks like a
          # credentials problem rather than the timing one it actually is.
          for i in $(seq 1 20); do
            if docker run --rm postgres:17 psql "$DIRECT_URL" -tAc "SELECT 1" >/dev/null 2>&1; then
              echo "Reachable after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Still unreachable after 200s. Either the firewall rule did not apply,"
          echo "::error::or BACKUP_DATABASE_URL is wrong. It must be the doadmin connection —"
          echo "::error::the app role cannot read past row-level security."
          exit 1

      - name: Dump
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          # postgres:17 client — pg_dump refuses to read a newer server, and the
          # cluster is 17. Pinning this to 16 is what broke the first attempt.
          docker run --rm -v "$PWD:/work" -w /work \
            -e DIRECT_URL="$DIRECT_URL" \
            postgres:17 bash scripts/backup.sh ./backups

      - name: Verify the dump is readable before trusting it
        id: verify
        run: |
          DUMP=$(ls -1t backups/salonos-*.dump | head -1)
          # A dump that cannot be listed is not a backup. This is the same
          # mistake the restore script was written to catch: a file existing is
          # not evidence that it contains anything.
          OBJECTS=$(docker run --rm -v "$PWD:/work" -w /work postgres:17 \
            pg_restore -l "$DUMP" | grep -cE "TABLE DATA|TABLE ")
          echo "$DUMP contains $OBJECTS objects"
          if [ "$OBJECTS" -lt 10 ]; then
            echo "::error::Dump has only $OBJECTS objects — refusing to call this a backup."
            exit 1
          fi
          echo "size=$(stat -c%s "$DUMP")" >> "$GITHUB_OUTPUT"


      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: salonos-db-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error

      - name: Close the firewall
        # `always()` on purpose: a failed dump must not leave the database
        # reachable from a runner IP that someone else will hold tomorrow.
        if: always()
        env:
          RUNNER_IP: ${{ steps.fw.outputs.ip }}
        run: |
          # Match on the exact rule via JSON, never by grepping formatted text.
          #
          # The first version of this did `... --format UUID,Value | grep "$IP"
          # | cut -f1`. Two faults compounded: cut splits on tabs by default
          # while doctl pads with spaces, so it returned whole lines rather
          # than UUIDs; and an empty $IP made grep match every row. It deleted
          # the APP's trusted-source rule and left the runner's behind —
          # exactly inverted — which took production down until someone noticed.
          #
          # Refusing to act on an empty IP, and requiring type == ip_addr,
          # means the worst case is now a stale runner rule rather than an
          # outage. A leftover rule is a problem you can see and fix; a
          # deleted app rule looks like the application is broken.
          if [ -z "$RUNNER_IP" ]; then
            echo "::warning::No runner IP recorded — the firewall step did not run."
            echo "::warning::Not removing anything: a blind delete here caused an outage once."
            exit 0
          fi

          UUID=$(doctl databases firewalls list "${{ secrets.DO_DATABASE_CLUSTER_ID }}" -o json \
            | jq -r --arg ip "$RUNNER_IP" \
                'map(select(.type == "ip_addr" and .value == $ip)) | .[0].uuid // empty')

          if [ -z "$UUID" ]; then
            echo "No ip_addr rule found for $RUNNER_IP — nothing to remove."
            exit 0
          fi

          doctl databases firewalls remove "${{ secrets.DO_DATABASE_CLUSTER_ID }}" --uuid "$UUID"
          echo "Removed ip_addr rule $UUID for $RUNNER_IP"

          # The app must still be able to reach its own database. If this ever
          # reports missing, the job has broken production and needs to say so
          # loudly rather than finishing green.
          if ! doctl databases firewalls list "${{ secrets.DO_DATABASE_CLUSTER_ID }}" -o json \
            | grep -q '"type": *"app"'; then
            echo "::error::No app trusted-source rule remains on the cluster. The application"
            echo "::error::cannot reach its database. Restore it immediately with:"
            echo "::error::  doctl databases firewalls append <cluster> --rule app:<app-id>"
            exit 1
          fi

      - name: Report the outcome to the app
        # `always()`, and it reports FAILURES as well as successes. A backup that
        # silently stops is the failure mode this project has actually suffered:
        # four consecutive nights failed and nothing said so. Because both
        # outcomes are recorded, a gap in the history in Admin -> System means
        # the job did not run at all, which is as informative as a red row.
        #
        # Never fails the job. A working backup that could not phone home is
        # still a working backup, and turning it red would train people to
        # ignore red. The app catches a broken reporter from the other side —
        # it warns when no successful backup has been recorded recently — so
        # neither piece has to be trusted on its own.
        if: always()
        env:
          TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
          REPORT_URL: ${{ secrets.BACKUP_REPORT_URL }}
          STARTED: ${{ steps.t.outputs.at }}
          SIZE: ${{ steps.verify.outputs.size }}
          RESULT: ${{ job.status }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REPORT_URL" ]; then
            echo "::warning::BACKUP_REPORT_TOKEN or BACKUP_REPORT_URL is unset — outcome not recorded."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then OK=true; else OK=false; fi
          if [ -n "$SIZE" ]; then SIZE_JSON="$SIZE"; else SIZE_JSON=null; fi
          MSG="job $RESULT"
          BODY=$(printf '{"source":"github-actions","ok":%s,"startedAt":"%s","sizeBytes":%s,"message":"%s","commit":"%s"}'             "$OK" "$STARTED" "$SIZE_JSON" "$MSG" "${GITHUB_SHA:0:7}")
          if curl -fsS --max-time 30 -X POST "$REPORT_URL/api/backups"                -H "Authorization: Bearer $TOKEN"                -H "Content-Type: application/json"                -d "$BODY" >/dev/null; then
            echo "Reported: $MSG"
          else
            echo "::warning::Could not report the backup outcome to the app."
          fi
