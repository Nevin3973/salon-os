name: Promote to production

# Promotes an image that is ALREADY RUNNING ON STAGING to production, by
# retagging it. It does not build anything.
#
# That distinction is the whole value of having a staging environment: production
# runs the exact bytes staging ran. A workflow that rebuilt from the same commit
# would produce a different image — different base-layer patches, different
# transitive dependency resolutions — and whatever staging proved would not
# strictly apply.
#
# Manual, and requires naming the commit explicitly. Nine salons trade on this;
# releasing should be a decision someone makes with a specific build in mind,
# not a button that ships whatever happens to be newest.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Short commit SHA to promote (must already be on staging)"
        required: true
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com/infynix-salonos
  IMAGE: salon-os
  APP_ID: a055938a-e11c-4e28-bb04-e9de6a756d30

jobs:
  promote:
    runs-on: ubuntu-latest
    # Attach a GitHub Environment so required reviewers can gate this. Without
    # protection rules configured it is a no-op label; with them, production
    # needs a second person to approve.
    environment: production
    steps:
      - name: Check confirmation
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Confirmation not given — expected the word: deploy"
          exit 1

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - run: doctl registry login --expiry-seconds 1200

      - name: Verify the image exists
        # Fail here, before anything is retagged, rather than deploying a tag
        # that turns out not to exist.
        run: |
          SHA="${{ github.event.inputs.sha }}"
          if ! docker pull "$REGISTRY/$IMAGE:$SHA"; then
            echo "No image tagged $SHA. Has it been through staging?"
            exit 1
          fi
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Retag as production
        run: |
          docker tag "$REGISTRY/$IMAGE:$SHA" "$REGISTRY/$IMAGE:latest"
          docker push "$REGISTRY/$IMAGE:latest"

      - name: Deploy
        # Migrations run as the app's PRE_DEPLOY job, inside DigitalOcean's
        # network — the database firewall admits the app and nothing else, and a
        # runner's address changes every run.
        run: doctl apps create-deployment "$APP_ID" --wait --format ID,Phase

      - name: Verify the live commit
        run: |
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS --max-time 20 https://beyonddemands.in/api/health \
                   | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "attempt $i: live=$LIVE expected=$SHA"
            if [ "$LIVE" = "$SHA" ]; then
              echo "Promoted $SHA to production." >> "$GITHUB_STEP_SUMMARY"
              curl -fsS --max-time 20 https://beyonddemands.in/api/health
              exit 0
            fi
            sleep 20
          done
          echo "The expected commit never went live. Check the App Platform logs."
          exit 1
