name: CI

# Runs on every push and pull request. Nothing here touches production — this
# only answers "would this build, and does it still pass its own tests".
#
# The database service exists because the row-level-security suite is an
# integration test by nature: it proves Postgres refuses cross-tenant reads,
# which cannot be checked with mocks. Those are the tests most worth running
# automatically, so CI builds a real database from the migrations and seeds it.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must match production (17). CI running an older Postgres than
        # production is how a version gap goes unnoticed — exactly the gap that
        # made every backup unrestorable with the local toolchain.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: salonos
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: salonos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salonos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://salonos:ci@localhost:5432/salonos
      DIRECT_URL: postgresql://salonos:ci@localhost:5432/salonos
      # Present so anything reading them at import time does not throw. These
      # are throwaway CI values and grant access to nothing.
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build the database from migrations
        # This is also a standing check that the migration history can rebuild
        # the schema from nothing. It could not, until the baseline: twelve
        # tables existed only because someone had run `db push`. If that drift
        # ever returns, this step fails here rather than during an incident.
        run: npx prisma migrate deploy

      - name: Seed
        run: npx prisma db seed

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
